site_name: maskel
site_description: 2D/3D skeletonization and graph-based phenotype analysis for network-like structures in segmentation masks
site_url: https://bionetslab.github.io/maskel/
repo_url: https://github.com/bionetslab/maskel
repo_name: bionetslab/maskel
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/logo-icon.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.expand
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Installation: installation.md
  - Glossary: glossary.md
  - napari-maskel ↗: https://bionetslab.github.io/napari-maskel/

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bionetslab
  generator: false
