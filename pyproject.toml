[project]
name = "maskel"
license = "MIT"
version = "2.0.0"
description = "2D and 3D Skeletonization and Graph-based Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argcomplete>=3.6.0",
    "itk>=5.4.6",
    "networkx>=3.4",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "scipy>=1.17.1",
    "skan>=0.13.1",
    "tifffile>=2026.3.3",
]

[project.urls]
Homepage = "https://github.com/bionetslab/maskel"
Repository = "https://github.com/bionetslab/maskel"
Documentation = "https://bionetslab.github.io/maskel/"
Changelog = "https://github.com/bionetslab/maskel/releases"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pooch>=1.9.0",
    "scikit-image>=0.26.0",
    "nibabel>=5.4.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maskel*"]

[project.scripts]
maskel = "maskel.cli:main"

[tool.pytest.ini_options]
markers = ["slow: big regression tests (skip with -m 'not slow')"]
