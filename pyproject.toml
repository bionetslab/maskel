[project]
name = "maskel"
license = "MIT"
version = "1.0.0"
description = "2D and 3D Skeletonization and Graph-based Analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argcomplete>=3.6.0",
    "itk>=5.4.6",
    "networkx>=3.4",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "skan>=0.13.1",
    "tifffile>=2026.1.10",
]

[project.urls]
Homepage = "https://github.com/bionetslab/maskel"
Repository = "https://github.com/bionetslab/maskel"
Documentation = "https://github.com/bionetslab/maskel#readme"
Changelog = "https://github.com/bionetslab/maskel/releases"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pooch>=1.9.0",
    "scikit-image>=0.26.0",
    "nibabel>=5.4.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maskel*"]

[project.scripts]
maskel = "maskel.cli:main"

[tool.pytest.ini_options]
markers = ["slow: big regression tests (skip with -m 'not slow')"]
